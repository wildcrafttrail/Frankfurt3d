<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1520" />
  <title>Frankfurt Explorer — precyzyjna mapa 3D</title>
  <link href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    :root { --ink:#f3f6f9; --muted:#b4c3d0; --panel:rgba(10,20,31,.91); --border:rgba(192,210,222,.22); --accent:#ecba70; --soft:#223342; }
    * { box-sizing: border-box; }
    html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#111c25;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
    button,select {font:inherit;} button {cursor:pointer;-webkit-tap-highlight-color:transparent;}
    #map {position:fixed;inset:0;background:linear-gradient(180deg,#a9bdcb,#d9d5c9);}
    #shade {position:fixed;pointer-events:none;inset:0;background:linear-gradient(to bottom,rgba(1,9,16,.46),transparent 27%,transparent 67%,rgba(2,11,20,.38));}
    .top {position:fixed;z-index:8;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:flex-start;gap:8px;justify-content:space-between;pointer-events:none;}
    .brand,.status,.panel,.pill,.navpad button,.info {background:var(--panel);border:1px solid var(--border);box-shadow:0 8px 26px rgba(0,0,0,.18);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);}
    .brand {padding:12px 14px;border-radius:15px;pointer-events:auto;max-width:70%;}
    .eyebrow {font-size:10px;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;font-weight:800;}
    h1 {font-size:17px;line-height:1.17;margin:4px 0 5px;font-weight:790;letter-spacing:.3px;}
    .sub {font-size:11px;color:var(--muted);line-height:1.3;}
    .status {pointer-events:auto;border-radius:15px;padding:10px 11px;max-width:38%;font-size:11px;line-height:1.3;color:#d2dce6;text-align:right;}
    .dot {display:inline-block;width:7px;height:7px;border-radius:50%;background:#72dab8;margin-right:5px;}
    .panel {position:fixed;z-index:8;left:12px;top:calc(106px + env(safe-area-inset-top));padding:10px;border-radius:16px;display:flex;flex-direction:column;gap:8px;width:min(260px,calc(100vw - 24px));}
    .row {display:flex;gap:6px;align-items:center;}
    .control {border:1px solid rgba(209,220,225,.24);background:rgba(32,48,64,.92);color:var(--ink);border-radius:10px;padding:10px 10px;font-weight:680;font-size:12px;min-height:39px;flex:1;}
    .control.active {color:#16202a;background:var(--accent);border-color:var(--accent);}
    .control:active,.navpad button:active {transform:scale(.97);}
    .wide {width:100%;}
    .small {font-size:11px;color:var(--muted);line-height:1.36;}
    .line {height:1px;background:var(--border);margin:1px 0;}
    .place {flex:1;min-width:0;border:1px solid rgba(209,220,225,.24);border-radius:9px;padding:9px 6px;background:#223241;color:#fff;font-size:12px;}
    .crosshair {position:fixed;top:50%;left:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.9);border-radius:50%;box-shadow:0 0 0 2px rgba(5,15,25,.38);pointer-events:none;z-index:4;display:none;}
    .crosshair:after {content:"";position:absolute;left:7px;top:7px;width:2px;height:2px;background:white;border-radius:50%;}
    .zoom {position:fixed;z-index:8;right:12px;top:calc(106px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;}
    .pill {border-radius:12px;color:var(--ink);padding:10px 13px;min-width:47px;min-height:42px;font-size:20px;line-height:1;border-color:var(--border);}
    .navwrap {position:fixed;z-index:8;bottom:calc(20px + env(safe-area-inset-bottom));right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 24px);}
    .navtitle {background:rgba(10,20,31,.85);border:1px solid var(--border);padding:6px 9px;border-radius:9px;color:#d1dbe6;font-size:10px;}
    .navpad {display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,50px);gap:6px;touch-action:none;user-select:none;-webkit-user-select:none;}
    .navpad button {border-radius:14px;border-color:var(--border);color:white;font-size:23px;touch-action:none;user-select:none;-webkit-user-select:none;}
    .navpad .smallarr {font-size:16px;}
    .bottomleft {position:fixed;left:12px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:8;max-width:calc(100vw - 200px);}
    .coords {padding:8px 10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:#d8e2e9;font-size:10px;line-height:1.6;backdrop-filter:blur(12px);}
    #toast {position:fixed;z-index:30;left:50%;bottom:calc(145px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#102232;border:1px solid rgba(233,193,126,.46);color:#edf4f8;border-radius:12px;padding:12px 16px;max-width:min(480px,88vw);font-size:12px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.28);display:none;text-align:center;}
    #details {position:fixed;z-index:15;left:12px;bottom:calc(137px + env(safe-area-inset-bottom));width:min(340px,calc(100vw - 24px));background:rgba(9,22,33,.96);border:1px solid var(--border);border-radius:16px;padding:15px;box-shadow:0 12px 30px #0007;display:none;}
    #details h2 {font-size:15px;margin:0 22px 8px 0;color:var(--accent)}
    #details .metas {font-size:12px;line-height:1.62;color:#dce7ee;}
    #details button {position:absolute;right:10px;top:8px;background:none;color:white;font-size:21px;border:0;}
    #details a {color:var(--accent);font-size:12px;display:inline-block;margin-top:9px;}
    .maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right {bottom:0!important;}
    .maplibregl-ctrl-attrib {background:rgba(255,255,255,.82)!important;font-size:9px!important;}
    @media (max-height:710px){.panel{top:calc(84px + env(safe-area-inset-top));}.top .brand{padding:8px 10px;}h1{font-size:15px}.navpad{grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,42px)}.navwrap{bottom:calc(15px + env(safe-area-inset-bottom))}.bottomleft{bottom:calc(15px + env(safe-area-inset-bottom))}}
    @media (max-width:390px){.panel{width:222px}.control{padding:8px 6px;font-size:11px}.status{font-size:10px}.place{font-size:11px}}
  </style>
</head>
<body>
<div id="map" aria-label="Interaktywna mapa 3D Frankfurtu"></div>
<div id="shade"></div>
<header class="top">
  <div class="brand"><div class="eyebrow">Frankfurt am Main</div><h1>EXPLORER 3D <span style="color:#ecba70;font-size:11px">V2</span></h1><div class="sub">Rzeczywiste obrysy · budynki · piętra OSM</div></div>
  <div id="netStatus" class="status"><span class="dot"></span>Ładowanie mapy...</div>
</header>
<section class="panel" aria-label="Ustawienia mapy">
  <div class="row">
    <button class="control active" data-mode="3d">3D</button>
    <button class="control" data-mode="street">Ulica</button>
    <button class="control" data-mode="2d">2D</button>
  </div>
  <div class="row"><select class="place" id="place" aria-label="Wybierz miejsce">
    <option value="romer">Römerberg — Stare Miasto</option>
    <option value="hauptwache">Hauptwache</option>
    <option value="alteoper">Alte Oper</option>
    <option value="hauptbahnhof">Hauptbahnhof</option>
    <option value="mainTower">Main Tower / Bankenviertel</option>
  </select><button id="go" class="control" style="flex:0 0 auto">Idź</button></div>
  <button class="control wide" id="loadOSM">Pokaż dokładne obrysy i piętra</button>
  <div id="detailStatus" class="small">Szczegółowe dane OSM pobierane są na żądanie dla okolicy o promieniu 300 m.</div>
  <div class="line"></div>
  <div class="row"><button id="labels" class="control active">Piętra: WŁ.</button><button id="reset" class="control">Centruj</button></div>
</section>
<div class="zoom"><button id="zoomPlus" class="pill" aria-label="Przybliż">+</button><button id="zoomMinus" class="pill" aria-label="Oddal">−</button></div>
<div id="crosshair" class="crosshair"></div>
<div class="bottomleft"><div id="coords" class="coords">50.1106 N · 8.6822 E<br/>Widok: 3D</div></div>
<div id="nav" class="navwrap" style="display:none">
  <div class="navtitle">Przytrzymaj strzałkę, aby się poruszać</div>
  <div class="navpad">
    <button data-drive="left" title="Obróć w lewo">↶</button>
    <button data-drive="forward" title="Idź naprzód">↑</button>
    <button data-drive="right" title="Obróć w prawo">↷</button>
    <button data-drive="strafeLeft" title="W lewo" class="smallarr">←</button>
    <button data-drive="backward" title="Idź w tył">↓</button>
    <button data-drive="strafeRight" title="W prawo" class="smallarr">→</button>
  </div>
</div>
<div id="details" role="dialog" aria-label="Informacja o budynku"><button id="closeDetails" aria-label="Zamknij">×</button><h2 id="buildingTitle">Budynek</h2><div id="buildingMeta" class="metas"></div><a id="buildingOsmLink" target="_blank" rel="noopener noreferrer" style="display:none">Zobacz w OpenStreetMap</a></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const homes = {
  romer:       {center:[8.68224,50.11059], zoom:17.5, bearing:-24},
  hauptwache:  {center:[8.67895,50.11348], zoom:17.5, bearing:-26},
  alteoper:    {center:[8.67194,50.11572], zoom:17.5, bearing:0},
  hauptbahnhof:{center:[8.66319,50.10720], zoom:17.5, bearing:5},
  mainTower:   {center:[8.67214,50.11250], zoom:17.5, bearing:-10}
};
let mode='3d', labelsVisible=true, map, osmFeatures=[], osmPoints=[], lastOSMCenter=null;
let toastTimer, moving=null, lastFrame=0, osmWorking=false;
const sourceName='osm-local';
function toast(msg, duration=4000) { let t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.style.display='none'},duration); }
function say(msg) {$('netStatus').innerHTML='<span class="dot"></span>'+msg;}
function status(msg) {$('detailStatus').textContent=msg;}
function safeNumber(val) { const n=Number(String(val).replace(',','.')); return Number.isFinite(n)?n:null; }
function heightFromOSM(raw) {
  if (!raw) return null;
  const s=String(raw).trim().replace(',','.');
  const m=s.match(/^([0-9]+(?:\.[0-9]+)?)\s*(m|metres?|meters?|ft|feet|')?$/i);
  if (!m) return null;
  let h=Number(m[1]); if(m[2] && /^(ft|feet|')$/i.test(m[2])) h*=0.3048;
  return h>=0&&h<700 ? h : null;
}
function validFloors(raw) {
 if (raw===undefined||raw===null) return null;
 let s=String(raw).trim(); if(!/^\d+(\.\d+)?$/.test(s))return null;
 const n=Number(s); return n>=0 && n<=160? n:null;
}
function distanceMeters(a,b) {
 const rad=Math.PI/180, lat=(a[1]+b[1])/2*rad;
 return Math.hypot((a[1]-b[1])*111195,(a[0]-b[0])*111195*Math.cos(lat));
}
function polygonCentroid(ring) {
 let sx=0,sy=0,twice=0;
 for(let i=0;i<ring.length-1;i++) {const [ax,ay]=ring[i], [bx,by]=ring[i+1];let z=ax*by-bx*ay;twice+=z;sx+=(ax+bx)*z;sy+=(ay+by)*z;}
 if(Math.abs(twice)>1e-11)return [sx/(3*twice),sy/(3*twice)];
 let arr=ring.slice(0,-1);return [arr.reduce((a,p)=>a+p[0],0)/arr.length,arr.reduce((a,p)=>a+p[1],0)/arr.length];
}
function convertElements(elems) {
 const buildings=[],points=[];
 const seen=new Set();
 for (let item of elems) {
   if(item.type!=='way'||!Array.isArray(item.geometry)||item.geometry.length<3||seen.has(item.id))continue;
   seen.add(item.id);
   const ring=item.geometry.map(p=>[p.lon,p.lat]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));
   if(ring.length<3)continue;
   if(ring[0][0]!==ring[ring.length-1][0]||ring[0][1]!==ring[ring.length-1][1])ring.push([...ring[0]]);
   if(ring.length<4)continue;
   const tags=item.tags||{}, levels=validFloors(tags['building:levels']), height=heightFromOSM(tags.height);
   const center=polygonCentroid(ring), id=Number(item.id);
   const props={id, levels, height, name:tags.name||'', address:[tags['addr:street']||'',tags['addr:housenumber']||''].filter(Boolean).join(' '), type:tags.building||tags['building:part']||'', roof:tags['roof:shape']||'', minHeight:heightFromOSM(tags.min_height)||0};
   buildings.push({type:'Feature',id,properties:props,geometry:{type:'Polygon',coordinates:[ring]}});
   if(levels!==null) points.push({type:'Feature',properties:{id,levels,label:`${levels} p.`,...props},geometry:{type:'Point',coordinates:center}});
 }
 return {buildings,points};
}
function emptyFeatureCollection() {return {type:'FeatureCollection',features:[]};}
function updateOSM() {
 if(!map||!map.getSource(sourceName))return;
 map.getSource(sourceName).setData({type:'FeatureCollection',features:osmFeatures});
 map.getSource('osm-level-points').setData({type:'FeatureCollection',features:osmPoints});
}
function setLabelVisibility() {
 if(!map||!map.getLayer('osm-level-labels'))return;
 map.setLayoutProperty('osm-level-labels','visibility',labelsVisible?'visible':'none');
 $('labels').classList.toggle('active',labelsVisible);
 $('labels').textContent=`Piętra: ${labelsVisible?'WŁ.':'WYŁ.'}`;
}
function initLayers() {
 const layers=map.getStyle().layers;
 const old3d=layers.find(l=>l['source-layer']==='building' && l.type==='fill-extrusion');
 const source=old3d?old3d.source:'openmaptiles';
 const beforeLabel=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field'])?.id;
 const palette=['interpolate',['linear'],['coalesce',['get','render_height'],9],0,'#d7dedf',18,'#c7ced2',45,'#aabdc8',120,'#899eae',240,'#718a9b'];
 if(old3d) {
   map.setPaintProperty(old3d.id,'fill-extrusion-color',palette);
   map.setPaintProperty(old3d.id,'fill-extrusion-opacity',0.96);
 } else if(map.getSource(source)) {
   map.addLayer({id:'custom-building-3d',type:'fill-extrusion',source,'source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':palette,'fill-extrusion-height':['coalesce',['get','render_height'],9],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':0.96}},beforeLabel);
 }
 if(map.getSource(source))map.addLayer({id:'custom-building-outline',type:'line',source,'source-layer':'building',minzoom:15,paint:{'line-color':'#47545d','line-width':['interpolate',['linear'],['zoom'],15,0.25,19,1.1],'line-opacity':0.52}},beforeLabel);
 map.addSource(sourceName,{type:'geojson',data:emptyFeatureCollection()});
 map.addSource('osm-level-points',{type:'geojson',data:emptyFeatureCollection()});
 // OSM lokalne: obrysy na bazie rzeczywistych wielokątów budynków.
 map.addLayer({id:'osm-footprints',type:'line',source:sourceName,paint:{'line-color':'#f3b75e','line-width':['interpolate',['linear'],['zoom'],14,1,19,2.2],'line-opacity':0.87}});
 map.addLayer({id:'osm-pick',type:'fill',source:sourceName,paint:{'fill-color':'#f4c171','fill-opacity':0.012}});
 map.addLayer({id:'osm-level-labels',type:'symbol',source:'osm-level-points',minzoom:16,layout:{'text-field':['get','label'],'text-font':['Noto Sans Bold'],'text-size':['interpolate',['linear'],['zoom'],16,10,19,13],'text-allow-overlap':false,'text-ignore-placement':false},paint:{'text-color':'#30210f','text-halo-color':'#ffdd9d','text-halo-width':2.4}});
}
function setMode(next) {
 mode=next;
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
 $('nav').style.display=mode==='street'?'flex':'none';
 $('crosshair').style.display=mode==='street'?'block':'none';
 if(!map)return;
 const pitch=mode==='2d'?0:mode==='street'?80:62, zoom=mode==='street'?Math.max(map.getZoom(),18.6):mode==='2d'?Math.max(15.3,map.getZoom()-0.5):Math.max(map.getZoom(),16.8);
 map.easeTo({pitch,zoom,duration:900});
 updateCoordinates();
 if(mode==='street')toast('Widok uliczny jest symulacją perspektywy 3D, bez realistycznych fasad i kolizji.');
}
function updateCoordinates() {
 if(!map)return;
 let c=map.getCenter(); $('coords').innerHTML=`${c.lat.toFixed(5)} N · ${c.lng.toFixed(5)} E<br/>Widok: ${mode==='street'?'ulica':mode.toUpperCase()} · zoom ${map.getZoom().toFixed(1)}`;
}
function closeDetails() {$('details').style.display='none';}
function showInfo(feature,base=false) {
 closeDetails();
 const p=feature.properties||{};
 $('buildingTitle').textContent=p.name||'Budynek · Frankfurt';
 const metas=[];
 if(p.address)metas.push(`Adres: ${p.address}`);
 if(p.levels!==undefined && p.levels!==null && p.levels!=='' && p.levels!=='null')metas.push(`Liczba pięter (OSM): ${p.levels}`);
 if(p.height!==undefined && p.height!==null && p.height!=='' && p.height!=='null')metas.push(`Wysokość wpisana w OSM: ${Number(p.height).toFixed(1)} m`);
 if(base && p.render_height!==undefined)metas.push(`Wysokość bryły na mapie: ${Number(p.render_height).toFixed(1)} m (wartość modelowa)`);
 if(p.roof)metas.push(`Typ dachu wg OSM: ${p.roof}`);
 if(p.type)metas.push(`Rodzaj: ${p.type}`);
 if(!metas.length)metas.push('Brak dokładnych atrybutów budynku w dostępnych danych.');
 $('buildingMeta').textContent=metas.join('\n');
 $('buildingMeta').style.whiteSpace='pre-line';
 const id=Number(p.id), link=$('buildingOsmLink');
 link.style.display=Number.isSafeInteger(id)&&id>0&&!base?'inline-block':'none';
 if(link.style.display!=='none')link.href=`https://www.openstreetmap.org/way/${id}`;
 $('details').style.display='block';
}
async function loadOverpass() {
 if(!map||osmWorking)return;
 const center=map.getCenter(), lat=center.lat,lon=center.lng;
 osmWorking=true;const btn=$('loadOSM');btn.disabled=true;btn.textContent='Pobieranie szczegółów…';
 status('Pobieram budynki, ich obrysy i znane liczby pięter z OpenStreetMap…');
 const query=`[out:json][timeout:25];(way["building"](around:300,${lat.toFixed(6)},${lon.toFixed(6)});way["building:part"](around:300,${lat.toFixed(6)},${lon.toFixed(6)}););out tags geom;`;
 const urls=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
 let lastError='Błąd połączenia z Overpass';
 try {
  let data;
  for(const url of urls) {
    const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),29000);
    try {
       const response=await fetch(url,{method:'POST',body:new URLSearchParams({data:query}),signal:controller.signal,headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'}});
       if(!response.ok)throw Error(`HTTP ${response.status}`);
       data=await response.json();
       if(!Array.isArray(data.elements))throw Error('Brak listy obiektów');
       break;
    }catch(e){lastError=e.message||String(e)}finally{clearTimeout(timer)}
  }
  if(!data)throw Error(lastError);
  const result=convertElements(data.elements);
  osmFeatures=result.buildings;osmPoints=result.points;lastOSMCenter=[lon,lat];
  updateOSM();
  status(`${osmFeatures.length} obrysów budynków · ${osmPoints.length} obiektów z podaną liczbą pięter · promień 300 m. Kolor miodowy = dokładny obrys z OSM.`);
  say('Mapa 3D · szczegóły załadowane');
  toast(`Pobrano ${osmFeatures.length} budynków. Liczba pięter dostępna dla ${osmPoints.length}.`);
 }catch(e) {
  status(`Nie udało się pobrać dodatkowych danych (${e.message}). Mapa 3D nadal działa.`);
  toast('Serwer szczegółowych danych jest niedostępny. Spróbuj ponownie.',6500);
 }finally{osmWorking=false;btn.disabled=false;btn.textContent='Odśwież obrysy i piętra';}
}
function moveMeters(lon,lat,heading,meters) {
 let r=heading*Math.PI/180;const deltaLat=Math.cos(r)*meters/111195;
 const deltaLon=Math.sin(r)*meters/(111195*Math.cos(lat*Math.PI/180));
 return [lon+deltaLon,lat+deltaLat];
}
function drive(timestamp) {
 if(!moving||!map||mode!=='street'){lastFrame=0;return;}
 if(!lastFrame)lastFrame=timestamp;
 let dt=Math.min(0.05,(timestamp-lastFrame)/1000);lastFrame=timestamp;
 const center=map.getCenter(),b=map.getBearing();
 if(moving==='left'||moving==='right')map.jumpTo({bearing:b+(moving==='left'?-1:1)*55*dt});
 else {
  const heading=b+(moving==='backward'?180:moving==='strafeLeft'?-90:moving==='strafeRight'?90:0);
  const speed=(moving==='forward'?3.2:moving==='backward'?2.0:2.4);
  map.jumpTo({center:moveMeters(center.lng,center.lat,heading,speed*dt)});
 }
 requestAnimationFrame(drive);
}
function setupDrive() {
 document.querySelectorAll('[data-drive]').forEach(btn=>{
   btn.addEventListener('pointerdown',ev=>{ev.preventDefault();btn.setPointerCapture(ev.pointerId);moving=btn.dataset.drive;lastFrame=0;requestAnimationFrame(drive)});
   const stop=()=>{moving=null;lastFrame=0;};
   btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop);btn.addEventListener('lostpointercapture',stop);
 });
 document.addEventListener('visibilitychange',()=>{if(document.hidden){moving=null;lastFrame=0;}});
}
function goToPlace() {
 const place=homes[$('place').value];if(!place||!map)return;
 closeDetails();
 map.flyTo({center:place.center,zoom:mode==='street'?19:place.zoom,pitch:mode==='2d'?0:mode==='street'?80:62,bearing:place.bearing,speed:1.15});
}
function initialize() {
 if(typeof maplibregl==='undefined'){say('Błąd pobrania biblioteki');toast('Nie można załadować MapLibre. Sprawdź dostęp do Internetu.',8000);return;}
 map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:homes.romer.center,zoom:homes.romer.zoom,pitch:62,bearing:-24,maxPitch:85,minZoom:12,maxZoom:21,antialias:true,centerClampedToGround:false,attributionControl:true});
 map.addControl(new maplibregl.NavigationControl({showCompass:true,showZoom:false}),'bottom-right');
 map.on('load',()=>{
  try{initLayers()}catch(e){console.error(e);toast('Niektóre warstwy szczegółów nie mogły zostać uruchomione.');}
  say('Mapa 3D · online');updateCoordinates();
 });
 map.on('move',updateCoordinates);
 map.on('error',e=>{console.error('Błąd mapy:',e.error||e);});
 map.on('click',e=>{
   if(!map.getLayer('osm-pick'))return;
   const local=map.queryRenderedFeatures(e.point,{layers:['osm-pick']});
   if(local.length){showInfo(local[0]);return;}
   const styles=map.getStyle().layers.filter(l=>l.type==='fill-extrusion'&&l['source-layer']==='building').map(l=>l.id);
   if(styles.length) {let features=map.queryRenderedFeatures(e.point,{layers:styles});if(features.length)showInfo(features[0],true);}
 });
 document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)));
 $('loadOSM').addEventListener('click',loadOverpass);
 $('labels').addEventListener('click',()=>{labelsVisible=!labelsVisible;setLabelVisibility()});
 $('go').addEventListener('click',goToPlace);
 $('place').addEventListener('change',goToPlace);
 $('reset').addEventListener('click',()=>{map.easeTo({pitch:mode==='street'?80:mode==='2d'?0:62,bearing:0,zoom:mode==='street'?18.9:17.5,duration:800})});
 $('zoomPlus').addEventListener('click',()=>map.zoomIn({duration:300}));
 $('zoomMinus').addEventListener('click',()=>map.zoomOut({duration:300}));
 $('closeDetails').addEventListener('click',closeDetails);
 setupDrive();
}
initialize();
})();
</script>
</body>
</html>
